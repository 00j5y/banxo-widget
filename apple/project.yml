name: Banxo
schemes:
  BanxoIOS:
    build:
      targets:
        BanxoIOS: all
  BanxoMac:
    build:
      targets:
        BanxoMac: all
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  BanxoCore:
    path: BanxoCore
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    INFOPLIST_KEY_BanxoAppGroup: $(BANXO_APP_GROUP)
    INFOPLIST_KEY_BanxoKeychainGroup: $(BANXO_KEYCHAIN_GROUP)
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targetTemplates:
  App:
    type: application
    sources: [App, Shared]
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    dependencies:
      - package: BanxoCore
    info:
      properties:
        CFBundleDisplayName: Banxo
        BanxoAppGroup: $(BANXO_APP_GROUP)
        BanxoKeychainGroup: $(BANXO_KEYCHAIN_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: banxo
            CFBundleURLSchemes: [banxo]
  Widget:
    type: app-extension
    sources: [Widget, Shared]
    configFiles:
      Debug: Configuration/Base.xcconfig
      Release: Configuration/Base.xcconfig
    dependencies:
      - package: BanxoCore
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      properties:
        CFBundleDisplayName: Solde Banxo
        BanxoAppGroup: $(BANXO_APP_GROUP)
        BanxoKeychainGroup: $(BANXO_KEYCHAIN_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
targets:
  BanxoIOS:
    info:
      path: Configuration/BanxoIOS-Info.plist
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANXO_BUNDLE_PREFIX).ios
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: BanxoIOSWidget
        embed: true
  BanxoIOSWidget:
    info:
      path: Configuration/BanxoIOSWidget-Info.plist
    templates: [Widget]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANXO_BUNDLE_PREFIX).ios.widget
        CODE_SIGN_ENTITLEMENTS: Configuration/iOS.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
  BanxoMac:
    info:
      path: Configuration/BanxoMac-Info.plist
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANXO_BUNDLE_PREFIX).mac
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
    dependencies:
      - target: BanxoMacWidget
        embed: true
  BanxoMacWidget:
    info:
      path: Configuration/BanxoMacWidget-Info.plist
    templates: [Widget]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BANXO_BUNDLE_PREFIX).mac.widget
        CODE_SIGN_ENTITLEMENTS: Configuration/macOS.entitlements
